name: Screener harian BEI

on:
  schedule:
    # 09:20 UTC = 16:20 WIB = 17:20 WITA, Senin-Jumat (setelah penutupan bursa).
    # Jadwal GitHub bisa terlambat 10-30 menit; laporan sore jalan 18:00 WITA.
    - cron: "20 9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: screener
  cancel-in-progress: false

jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang dependensi
        # yfinance sengaja tidak dikunci: Yahoo sering berubah dan perbaikannya datang lewat versi terbaru
        run: pip install --upgrade yfinance "pandas>=2.2"

      - name: Jalankan screener
        run: python screener.py

      - name: Simpan hasil
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "Data screener $(TZ=Asia/Jakarta date +%F)"
            git push
          fi
